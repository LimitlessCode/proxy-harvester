[package]
name = "proxy-harvester"
version = "0.1.0"
edition = "2021"
description = "High-quality proxy harvester with elite-only filtering"
repository = "https://github.com/LimitlessCode/proxy-harvester"
readme = "README.md"
homepage = "https://github.com/LimitlessCode/proxy-harvester"
keywords = ["proxy", "proxy-scraper", "socks5", "anonymity", "network"]
categories = ["command-line-utilities", "network-programming"]

[workspace]
members = ["panel"]
resolver = "2"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["socks", "rustls-tls", "json"], default-features = false }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
url = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
